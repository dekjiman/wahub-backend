services:
  postgres:
    image: postgres:15-alpine
    restart: always
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: wahub
      POSTGRES_USER: wahub
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wahub -d wahub"]
      interval: 5s
      timeout: 5s
      retries: 5
    command: >
      sh -c "
        mkdir -p /docker-entrypoint-initdb.d &&
        echo 'CREATE DATABASE evolution; CREATE DATABASE wahub_n8n; CREATE DATABASE evogo_auth; CREATE DATABASE evogo_users;' > /docker-entrypoint-initdb.d/01-init.sql &&
        exec docker-entrypoint.sh postgres
      "

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data

  evolution-api:
    image: evoapicloud/evolution-go:0.7.2
    container_name: evolution-go
    restart: always
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SERVER_PORT: 8080
      CLIENT_NAME: evolution
      GLOBAL_API_KEY: ${EVOLUTION_API_KEY:-wahub-evolution-api-key-2026}
      EVOLUTION_OPERATOR_EMAIL: ${EVOLUTION_OPERATOR_EMAIL:-}
      POSTGRES_AUTH_DB: postgresql://wahub:${DB_PASSWORD:-password}@postgres:5432/evogo_auth?sslmode=disable
      POSTGRES_USERS_DB: postgresql://wahub:${DB_PASSWORD:-password}@postgres:5432/evogo_users?sslmode=disable
      DATABASE_SAVE_MESSAGES: "true"
      # WEBHOOK_URL removed — per-instance webhookUrl is set via connect API to avoid duplicate delivery
      WADEBUG: INFO
      LOGTYPE: console
      CONNECT_ON_STARTUP: "true"
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy

  wahub-backend:
    build: .
    ports:
      - "${APP_PORT:-3100}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://wahub:${DB_PASSWORD:-password}@postgres:5432/wahub
      REDIS_URL: redis://redis:6379
      EVOLUTION_API_URL: http://evolution-api:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-wahub-evolution-api-key-2026}
      JWT_SECRET: ${JWT_SECRET:-wahub-super-secret-jwt-key-change-in-production-2026}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@wahub.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-password123}
      ADMIN_NAME: ${ADMIN_NAME:-Super Admin}
      EVOLUTION_WEBHOOK_URL: ${EVOLUTION_WEBHOOK_URL:-http://wahub-backend:3000/webhook/evolution}
      N8N_URL: http://n8n:5678
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://n8n:5678/webhook/onboarding-new-member}
      N8N_INCOMING_MESSAGE_URL: http://n8n:5678/webhook/incoming-message-v2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      evolution-api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    command: >
      sh -c "npx drizzle-kit push && node dist/src/scripts/bootstrap-admin.js && node dist/src/server.js"

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: always
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_HOST: 0.0.0.0
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: wahub_n8n
      DB_POSTGRESDB_USER: wahub
      DB_POSTGRESDB_PASSWORD: ${DB_PASSWORD:-password}
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD:-n8n-admin-2026}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-wahub-n8n-encryption-key-2026}
      N8N_API_KEY: ${N8N_API_KEY:-wahub-n8n-api-key-2026}
      N8N_SECURE_COOKIE: "false"
      GENERIC_TIMEZONE: Asia/Jakarta
      TZ: Asia/Jakarta
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  n8n_data:
